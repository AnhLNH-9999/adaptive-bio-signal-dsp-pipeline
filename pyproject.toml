[build-system]
requires = ["setuptools>=68", "wheel", "Cython>=3.0", "numpy>=1.24"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-bio-signal-dsp-pipeline"
version = "0.1.0"
description = "Real-time EEG DSP pipeline: LMS/RLS adaptive filtering, Wavelet + CSP features, Q15 fixed-point and a lightweight EEGNet branch."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Lê Nguyễn Hoài Anh" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyWavelets>=1.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["mne>=1.5", "moabb>=1.0", "scikit-learn>=1.3"]
nn = ["torch>=2.1", "brevitas>=0.10"]
dev = ["pytest>=7.0", "Cython>=3.0", "jupyter>=1.0", "nbformat>=5.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
