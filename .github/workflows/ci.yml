name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy PyWavelets matplotlib Cython pytest setuptools
      - name: Build Cython extensions
        run: python setup.py build_ext --inplace
      - name: Run unit tests
        run: python -m pytest -v
      - name: Run dataset-free scripts
        run: |
          python scripts/week2_rls/lambda_sweep.py
          python scripts/week2_rls/benchmark_all.py
          python scripts/week5_fixedpoint/day3_run_lms_q15.py
          python scripts/week5_fixedpoint/day4_sqnr.py
          python scripts/week6_macs/day1_macs_formula.py
          python scripts/week6_macs/day2_count_macs.py
          python scripts/week6_macs/day3_macs_per_sec.py
        env:
          MPLBACKEND: Agg
